<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="1024" height="1024">
  <!-- Dark navy background (full square — Apple clips corners itself) -->
  <rect width="220" height="220" fill="#0C1820"/>

  <!-- Three-color ring arcs (r=80, centered at 110,110) -->
  <path d="M 110,30 A 80,80 0 0,1 186.09,134.72" fill="none" stroke="#D93535" stroke-width="24" stroke-linecap="round"/>
  <path d="M 179.28,150 A 80,80 0 0,1 50.55,163.53" fill="none" stroke="#D4B800" stroke-width="24" stroke-linecap="round"/>
  <path d="M 40.72,150 A 80,80 0 0,1 93.37,31.75"  fill="none" stroke="#18C000" stroke-width="24" stroke-linecap="round"/>

  <!-- Clipboard clipped to inner circle (r=62) -->
  <defs>
    <clipPath id="cc">
      <circle cx="110" cy="110" r="62"/>
    </clipPath>
  </defs>
  <g clip-path="url(#cc)">
    <circle cx="110" cy="110" r="62" fill="#7EE7FF"/>
    <!-- 24×24 clipboard design scaled 5.1667× and placed at (48,48) -->
    <g transform="translate(48,48) scale(5.1667)">
      <g transform="translate(2.4,2.4) scale(0.80)">
        <path fill="#000000" d="M19,3h-4.18C14.4,1.84 13.3,1 12,1c-1.3,0 -2.4,0.84 -2.82,2L5,3c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2L21,5c0,-1.1 -0.9,-2 -2,-2z"/>
        <path fill="#7EE7FF" d="M12,3c0.55,0 1,0.45 1,1s-0.45,1 -1,1 -1,-0.45 -1,-1 0.45,-1 1,-1z"/>
        <path fill="#70FA0A" d="M10,17l-4,-4 1.41,-1.41L10,14.17l6.59,-6.59L18,9l-8,8z"/>
      </g>
    </g>
  </g>
</svg>
